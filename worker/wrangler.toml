name = "drive-notes-auth"
main = "index.js"
compatibility_date = "2026-09-01"

[vars]
GOOGLE_CLIENT_ID = "104411957628-eu5gbpopvot1ai5a95qbpdn3frcvko4r.apps.googleusercontent.com"

# GOOGLE_CLIENT_SECRET is a secret: `npx wrangler secret put GOOGLE_CLIENT_SECRET`, never a var here

# Rate limit on calls to Google, per caller IP and per Cloudflare location (approximate, not exact).
# namespace_id is any positive integer, written as a string; period is 10 or 60 seconds. Wrangler 4.36.0+.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "4127"
simple = { limit = 10, period = 60 }
