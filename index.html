<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- interactive-widget=resizes-content: the page shrinks when the keyboard opens, so the text being typed is never under it -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#242229">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Drive Notes</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <!-- Fontes: Figtree na interface, IBM Plex Mono no editor. Mesmo padrão das outras
       bibliotecas, CDN com versão fixa. O service worker guarda as duas, então só a
       primeira visita depende da rede; sem elas o fallback do sistema assume. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css">

  <!-- CodeMirror 6 (editor markdown; pacote único gerado, ver vendor/README.md) -->
  <script src="vendor/codemirror.js"></script>

  <!-- The two CDN scripts are locked by integrity: if the CDN ever serves a different file, the
       browser refuses to run it (the app has access to the whole Drive). A new version needs a new
       hash; scenario 0 of tests/app.test.js prints it. src stays the first attribute: the test
       page swaps these tags for local copies by matching '<script src="https://cdn...'. -->

  <!-- marked.js (markdown preview renderer) -->
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js" integrity="sha384-H+hy9ULve6xfxRkWIh/YOtvDdpXgV2fmAGQkIDTxIgZwNoaoBal14Di2YTMR6MzR" crossorigin="anonymous"></script>

  <!-- DOMPurify (sanitizes the rendered preview) -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" integrity="sha384-JEyTNhjM6R1ElGoJns4U2Ln4ofPcqzSsynQkmEc/KGy6336qAZl70tDLufbkla+3" crossorigin="anonymous"></script>

  <!-- Google Identity Services (login). Drive itself is called with plain fetch. -->
  <script async defer src="https://accounts.google.com/gsi/client" onload="onGisLoaded()"></script>
</head>
<body data-view="welcome">

  <!-- ── Header ── -->
  <header class="header">
    <div class="header-left">
      <button id="btn-back" class="btn btn-icon btn-back" title="Voltar" aria-label="Voltar">&#8592;</button>
      <span id="file-name" class="file-name">Drive Notes</span>
      <span id="save-status" class="save-status"></span>
    </div>
    <div class="header-actions">
      <button id="btn-new" class="btn btn-icon" title="Nova nota">+</button>
      <button id="btn-open" class="btn btn-icon" title="Abrir do Drive" aria-label="Abrir do Drive">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button id="btn-save" class="btn btn-icon" title="Salvar" aria-label="Salvar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      </button>
      <button id="btn-preview" class="btn btn-mode">Ler</button>
    </div>
  </header>

  <!-- ── New version ready, where reloading on its own could lose something (App.watchVersions) ── -->
  <button id="update-bar" class="update-bar hidden" type="button">Versão nova pronta · <span>atualizar</span></button>

  <!-- ── Welcome screen ── -->
  <div id="welcome" class="welcome">
    <h2>Drive Notes</h2>
    <p>Editor de markdown pessoal.<br>Anote ideias rápidas e brain dumps.</p>
    <button id="welcome-new" class="btn">Nova nota</button>
    <button id="welcome-open" class="btn">Abrir do Drive</button>
    <div id="drafts-list" class="recents-list drafts-list hidden">
      <h3>Não sincronizados</h3>
      <ul id="drafts-ul"></ul>
    </div>
    <div id="recents-list" class="recents-list hidden">
      <h3>Recentes</h3>
      <ul id="recents-ul"></ul>
    </div>
  </div>

  <!-- ── File browser ── -->
  <div id="browser" class="browser hidden">
    <div class="browser-top">
      <div id="browser-path" class="browser-path"></div>
      <div class="browser-search">
        <input id="browser-search" type="search" placeholder="Buscar nesta pasta e no vault" aria-label="Buscar"
               enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button id="browser-search-clear" class="browser-search-clear" title="Limpar busca" aria-label="Limpar busca">&#10005;</button>
      </div>
    </div>
    <ul id="browser-list" class="browser-list"></ul>
  </div>

  <!-- ── Editor ── -->
  <div id="editor-container" class="editor-container hidden">
    <div id="editor"></div>
  </div>

  <!-- ── Preview ── -->
  <!-- tabindex="-1": focusable but out of the tab order. On Chrome for Android a tap on text inside a
       focusable element does not open the Touch to Search bar; a long press still selects to copy -->
  <div id="preview-container" class="preview-container" tabindex="-1"></div>

  <!-- ── Toolbar (bottom, thumb-reachable) ── -->
  <nav class="toolbar">
    <button class="toolbar-btn" data-history="undo" title="Desfazer" aria-label="Desfazer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
    </button>
    <button class="toolbar-btn" data-history="redo" title="Refazer" aria-label="Refazer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
    </button>
    <div class="toolbar-separator"></div>
    <button class="toolbar-btn" data-format="wikilink" title="Link entre notas" aria-label="Link entre notas">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h3a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-3"/><path d="M8 21H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h3"/></svg>
    </button>
    <button class="toolbar-btn" data-format="tag" title="Tag" aria-label="Tag">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
    </button>
    <div class="toolbar-separator"></div>
    <button class="toolbar-btn" data-photo="camera" title="Tirar foto" aria-label="Tirar foto">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    </button>
    <button class="toolbar-btn" data-photo="gallery" title="Foto da galeria" aria-label="Foto da galeria">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </button>
    <button class="toolbar-btn" data-sketch="open" title="Desenhar" aria-label="Desenhar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
    </button>
    <div class="toolbar-separator"></div>
    <button class="toolbar-btn" data-format="heading" title="Título" aria-label="Título">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 12h12"/><path d="M6 20V4"/><path d="M18 20V4"/></svg>
    </button>
    <button class="toolbar-btn" data-format="bold" title="Negrito" aria-label="Negrito">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg>
    </button>
    <button class="toolbar-btn" data-format="italic" title="Itálico" aria-label="Itálico">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg>
    </button>
    <button class="toolbar-btn" data-format="strikethrough" title="Riscado" aria-label="Riscado">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
    </button>
    <button class="toolbar-btn" data-format="highlight" title="Marca-texto" aria-label="Marca-texto">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
    </button>
    <div class="toolbar-separator"></div>
    <button class="toolbar-btn" data-format="code" title="Código" aria-label="Código">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
    </button>
    <button class="toolbar-btn" data-format="quote" title="Citação" aria-label="Citação">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"/><path d="M5 3a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2 1 1 0 0 1 1 1v1a2 2 0 0 1-2 2 1 1 0 0 0-1 1v2a1 1 0 0 0 1 1 6 6 0 0 0 6-6V5a2 2 0 0 0-2-2z"/></svg>
    </button>
    <button class="toolbar-btn" data-format="link" title="Link" aria-label="Link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
    </button>
    <div class="toolbar-separator"></div>
    <button class="toolbar-btn" data-format="list" title="Lista" aria-label="Lista">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
    </button>
    <button class="toolbar-btn" data-format="ordered" title="Numerada" aria-label="Numerada">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5h10"/><path d="M11 12h10"/><path d="M11 19h10"/><path d="M4 4h1v5"/><path d="M4 9h2"/><path d="M6.5 20H3.4c0-1 2.6-1.925 2.6-3.5a1.5 1.5 0 0 0-2.6-1.02"/></svg>
    </button>
    <button class="toolbar-btn" data-format="checklist" title="Tarefa" aria-label="Tarefa">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    </button>
    <!-- Only while there is text selected in the editor (body.has-selection): see the style.css -->
    <button class="toolbar-btn toolbar-extract" data-extract title="Nota nova com o trecho" aria-label="Nota nova com o trecho">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
    </button>
  </nav>
  <!-- Recent Android opens the system photo picker for image/*, which has no camera:
       the camera button sets "capture" on this input before opening it -->
  <input id="photo-input" type="file" accept="image/*" hidden>

  <!-- Spacer to compensate for fixed toolbar -->
  <div class="toolbar-spacer"></div>

  <!-- ── Tela de desenho (por cima do editor). As cores nascem do SKETCH_COLORS do app.js ── -->
  <div id="sketch-screen" class="sketch-screen">
    <div class="sketch-top">
      <button id="sketch-cancel" class="btn btn-icon" title="Sair" aria-label="Sair do desenho">&#10005;</button>
      <span class="sketch-title">Desenho</span>
      <button id="sketch-done" class="btn btn-icon sketch-active" title="Pronto" aria-label="Pronto">&#10003;</button>
    </div>
    <canvas id="sketch-canvas" class="sketch-canvas"></canvas>
    <div id="sketch-colors" class="sketch-bar"></div>
    <div class="sketch-bar">
      <button class="sketch-tool" data-sketch-width="3" aria-label="Traço fino"><i style="width:4px;height:4px"></i></button>
      <button class="sketch-tool" data-sketch-width="6" aria-label="Traço médio"><i style="width:8px;height:8px"></i></button>
      <button class="sketch-tool" data-sketch-width="12" aria-label="Traço grosso"><i style="width:14px;height:14px"></i></button>
      <span class="sketch-gap"></span>
      <button id="sketch-erase" class="sketch-tool" aria-label="Borracha">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
      </button>
      <button id="sketch-undo" class="sketch-tool" aria-label="Desfazer">&#8630;</button>
    </div>
  </div>

  <!-- In every dialog, the button marked data-dismiss is what the system back button presses -->

  <!-- ── Modal: text input (rename) ── -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <h3>Renomear nota</h3>
      <input id="modal-input" type="text" placeholder="Nome do arquivo" autocomplete="off">
      <p id="modal-message" class="modal-message" hidden></p>
      <div class="modal-actions">
        <button id="modal-delete" class="btn btn-danger btn-quiet" hidden>Apagar</button>
        <button id="modal-cancel" class="btn" data-dismiss>Cancelar</button>
        <button id="modal-confirm" class="btn active">Criar</button>
      </div>
    </div>
  </div>

  <!-- ── Modal: file changed on Drive since it was opened ── -->
  <div id="conflict-overlay" class="modal-overlay">
    <div class="modal">
      <h3>Conflito com o Drive</h3>
      <p id="conflict-text" class="modal-text"></p>
      <div class="modal-actions modal-actions-stacked">
        <button class="btn active" data-conflict="copy">Salvar a minha como cópia</button>
        <button class="btn" data-conflict="overwrite">Sobrescrever o Drive</button>
        <button class="btn" data-conflict="reload">Descartar a minha e recarregar</button>
        <button class="btn" data-conflict="later" data-dismiss>Decidir depois</button>
      </div>
    </div>
  </div>

  <!-- ── Modal: confirm ── -->
  <div id="confirm-overlay" class="modal-overlay">
    <div class="modal">
      <h3 id="confirm-title"></h3>
      <p id="confirm-text" class="modal-text"></p>
      <div class="modal-actions">
        <button id="confirm-cancel" class="btn" data-dismiss>Cancelar</button>
        <button id="confirm-ok" class="btn btn-danger"></button>
      </div>
    </div>
  </div>

  <!-- ── Sheet: where something shared into the app goes, or "Anotar em…" from the icon (App.openArrivalSheet) ── -->
  <div id="arrival-overlay" class="modal-overlay">
    <div class="modal modal-wide">
      <h3 id="arrival-title">Guardar em…</h3>
      <p id="arrival-what" class="arrival-what" hidden></p>
      <p id="arrival-message" class="modal-message" hidden></p>
      <button id="arrival-login" class="btn active arrival-login" hidden>Entrar</button>
      <div class="recents-list arrival-list">
        <ul id="arrival-ul"></ul>
      </div>
      <div class="modal-actions">
        <button id="arrival-cancel" class="btn" data-dismiss>Cancelar</button>
      </div>
    </div>
  </div>

  <!-- ── Diagnostics (five taps on the welcome title) ── -->
  <div id="debug-overlay" class="modal-overlay">
    <div class="modal modal-wide">
      <h3>Diagnóstico</h3>
      <pre id="debug-text" class="debug-text"></pre>
      <div class="modal-actions">
        <button id="debug-copy" class="btn">Copiar</button>
        <button id="debug-close" class="btn active" data-dismiss>Fechar</button>
      </div>
    </div>
  </div>

  <!-- ── Edge swipe: the arrow that follows the finger (left = back, right = forward) ── -->
  <div id="swipe-hint" class="swipe-hint" aria-hidden="true"></div>

  <!-- App logic -->
  <script src="app.js"></script>

  <!-- Register Service Worker, and bring a new version to the screen in one opening. Read here,
       before anything else runs: whether a service worker was already in charge of this page. -->
  <script>
    if ('serviceWorker' in navigator) App.watchVersions(navigator.serviceWorker);
  </script>
</body>
</html>
